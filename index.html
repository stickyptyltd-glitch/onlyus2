<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only Us Two — paired, anonymous, sealed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.umd.min.js"></script>
<style>
  :root{
    --bg: #F3ECDD;
    --surface: #FBF6EA;
    --surface-2: #F0E6D2;
    --text: #241A2E;
    --text-muted: #6E6076;
    --accent: #B34A2A;
    --accent-ink: #FBF6EA;
    --accent-2: #6C55C2;
    --border: rgba(36,26,46,0.14);
    --danger: #A83232;
    --ok: #4C7A4C;
    --shadow: 0 1px 0 rgba(36,26,46,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #16121F; --surface: #221B31; --surface-2: #2A2140;
      --text: #F4EFFB; --text-muted: #A79BC0; --accent: #DD724A;
      --accent-ink: #1B1424; --accent-2: #A292F2; --border: rgba(244,239,251,0.14);
      --danger: #E28080; --ok: #7FBE7F;
    }
  }
  :root[data-theme="dark"]{
    --bg: #16121F; --surface: #221B31; --surface-2: #2A2140;
    --text: #F4EFFB; --text-muted: #A79BC0; --accent: #DD724A;
    --accent-ink: #1B1424; --accent-2: #A292F2; --border: rgba(244,239,251,0.14);
    --danger: #E28080; --ok: #7FBE7F;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:'Inter', system-ui, -apple-system, sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; accent-color:var(--accent); }
  .wrap{ max-width:460px; margin:0 auto; padding:26px 18px 40px; min-height:100vh; display:flex; flex-direction:column; }
  h1,h2,h3{ font-family:'Newsreader', Georgia, serif; font-weight:600; letter-spacing:-0.01em; margin:0; }
  a{ color:inherit; }
  .mono{ font-family:'IBM Plex Mono', 'SFMono-Regular', monospace; }

  .seal{ width:48px; height:48px; flex-shrink:0; }
  .seal-hero{ width:72px; height:72px; margin:0 auto 20px; }
  .seal-pulse{ animation: pulse 2.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.08); opacity:.75; } }
  .seal-drop{ animation: seal-drop 650ms cubic-bezier(.2,.9,.25,1.15) both; }
  @keyframes seal-drop{ 0%{ transform:scale(1.8) rotate(-12deg); opacity:0; } 60%{ opacity:1; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .seal-hero, .seal-pulse{ animation:none; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-name{ font-family:'Newsreader', serif; font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn{ background:none; border:1px solid var(--border); border-radius:9px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); flex-shrink:0; font-size:15px; }
  .icon-btn:hover{ color:var(--danger); border-color:var(--danger); }
  .link-btn{ background:none; border:none; color:var(--text-muted); font-family:'Inter', sans-serif; font-size:13px; cursor:pointer; padding:6px 0; flex-shrink:0; }
  .link-btn:hover{ color:var(--text); }

  .hero{ text-align:center; padding:14px 0 8px; }
  .hero h1,.hero h2{ font-size:28px; line-height:1.18; margin-bottom:12px; }
  .hero p{ color:var(--text-muted); font-size:14.5px; line-height:1.55; max-width:340px; margin:0 auto 28px; }

  button.primary{ width:100%; background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:14px 18px; font-family:'Inter', sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:transform .12s ease, opacity .12s ease; }
  button.primary:active{ transform:scale(0.985); }
  button.primary:disabled{ opacity:.45; cursor:default; }
  button.secondary{ width:100%; background:transparent; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:13px 18px; font-family:'Inter', sans-serif; font-size:14.5px; font-weight:500; cursor:pointer; }
  button.danger-solid{ width:100%; background:var(--danger); color:var(--accent-ink); border:none; border-radius:10px; padding:13px 18px; font-family:'Inter', sans-serif; font-size:14.5px; font-weight:600; cursor:pointer; }
  .quiet-note{ text-align:center; font-size:12px; color:var(--text-muted); line-height:1.6; margin-top:20px; }
  .text-input{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:15px; color:var(--text); outline:none; font-family:'Inter', sans-serif; }
  .text-input:focus{ border-color:var(--accent-2); }

  .anon-badge{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:6px 13px; font-size:11.5px; color:var(--text-muted); font-family:'Inter', sans-serif; letter-spacing:0.01em; }
  .anon-badge-wrap{ text-align:center; margin-bottom:22px; }

  .pair-card{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; margin-bottom:10px; cursor:pointer; text-align:left; }
  .pair-card .meta{ flex:1; min-width:0; }
  .pair-card .label{ font-size:14.5px; font-weight:500; }
  .pair-card .status{ font-size:12px; color:var(--text-muted); margin-top:3px; display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.paired{ background:var(--ok); }
  .dot.waiting{ background:var(--accent); }
  .section-label{ font-size:12.5px; color:var(--text-muted); margin:0 0 12px 2px; }
  .new-pair-fab{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:13px 18px; font-size:14.5px; font-weight:600; cursor:pointer; width:100%; margin-top:6px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .share-card{ margin-bottom:18px; }
  .share-card .label{ font-size:12px; color:var(--text-muted); margin-bottom:9px; }
  .share-row{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:9px; padding:11px 12px; }
  .share-row .url{ flex:1; font-family:'IBM Plex Mono', monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .copy-btn{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:7px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .waiting-state{ text-align:center; padding:20px 4px 4px; }
  .waiting-state h2{ font-size:19px; margin-bottom:8px; }
  .waiting-state p{ color:var(--text-muted); font-size:13.5px; line-height:1.55; max-width:300px; margin:0 auto 22px; }

  .status-row{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); margin-bottom:14px; }
  .thread{ flex:1; overflow-y:auto; padding:4px 2px 10px; display:flex; flex-direction:column; gap:10px; min-height:120px; max-height:50vh; }
  .bubble-row{ display:flex; }
  .bubble-row.me{ justify-content:flex-end; }
  .bubble-row.them{ justify-content:flex-start; }
  .bubble{ max-width:78%; padding:10px 13px; border-radius:14px; font-size:14.5px; line-height:1.48; white-space:pre-wrap; word-break:break-word; }
  .bubble-row.me .bubble{ background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; }
  .bubble-row.them .bubble{ background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .bubble.pending{ opacity:.55; font-style:italic; }
  .bubble.bubble-image{ padding:5px; }
  .bubble.bubble-audio{ padding:10px 12px; min-width:190px; }
  .bubble-time{ font-size:10.5px; color:var(--text-muted); margin-top:4px; font-family:'IBM Plex Mono', monospace; }
  .bubble-row.me .bubble-time{ text-align:right; }

  .msg-img{ display:block; max-width:100%; max-height:240px; border-radius:10px; cursor:zoom-in; }
  .audio-row{ display:flex; align-items:center; gap:10px; }
  .audio-row audio{ height:32px; max-width:150px; }
  .audio-row .dur{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; opacity:.85; flex-shrink:0; }
  .transcript{ margin-top:8px; font-size:12.5px; font-style:italic; opacity:.85; border-top:1px solid rgba(128,128,128,.25); padding-top:7px; line-height:1.45; }

  .composer{ display:flex; gap:7px; align-items:flex-end; margin-top:14px; }
  .composer textarea{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 13px; font-size:14.5px; color:var(--text); line-height:1.4; resize:none; outline:none; max-height:110px; font-family:'Inter', sans-serif; }
  .composer textarea:focus{ border-color:var(--accent-2); }
  .round-btn{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); border-radius:11px; width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px; }
  .round-btn:hover{ color:var(--text); }
  .send-btn{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:11px; width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
  .send-btn:disabled{ opacity:.4; cursor:default; }
  input[type=file]{ display:none; }

  .recording-row{ display:flex; align-items:center; gap:10px; margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:9px 12px; }
  .rec-dot{ width:9px; height:9px; border-radius:50%; background:var(--danger); animation:recblink 1.1s ease-in-out infinite; flex-shrink:0; }
  @keyframes recblink{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  .rec-time{ font-family:'IBM Plex Mono', monospace; font-size:13px; flex:1; }
  .rec-cancel, .rec-stop{ border:none; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .rec-cancel{ background:transparent; color:var(--text-muted); border:1px solid var(--border); }
  .rec-stop{ background:var(--accent); color:var(--accent-ink); }
  .uploading-row{ display:flex; align-items:center; gap:10px; margin-top:14px; font-size:12.5px; color:var(--text-muted); }

  .empty{ text-align:center; padding:30px 10px; color:var(--text-muted); }
  .empty .seal{ opacity:.5; margin:0 auto 12px; }
  .empty p{ font-size:13.5px; line-height:1.6; max-width:270px; margin:0 auto; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px); background:var(--text); color:var(--bg); font-size:13px; padding:10px 16px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; white-space:nowrap; z-index:10; max-width:88vw; overflow:hidden; text-overflow:ellipsis; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .skeleton{ background:linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:6px; height:14px; }
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

  .confirm-backdrop{ position:fixed; inset:0; background:rgba(20,14,26,0.5); display:flex; align-items:flex-end; justify-content:center; z-index:20; padding:0; }
  .confirm-sheet{ background:var(--surface); border-radius:18px 18px 0 0; padding:22px 20px 26px; width:100%; max-width:460px; }
  .confirm-sheet h3{ font-size:18px; margin-bottom:10px; }
  .confirm-sheet p{ font-size:13.5px; color:var(--text-muted); line-height:1.55; margin-bottom:12px; }
  .confirm-actions{ display:flex; flex-direction:column; gap:9px; }

  .lightbox{ position:fixed; inset:0; background:rgba(10,7,14,0.92); z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }

  .safety-code{ font-size:16px; letter-spacing:1.5px; background:var(--surface-2); border-radius:9px; padding:11px 13px; margin:8px 0 4px; text-align:center; }

  .sponsor-card{ display:block; background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:13px 15px; margin-top:22px; text-decoration:none; color:inherit; }
  .sponsor-label{ display:block; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px; }
  .sponsor-name{ display:block; font-size:14px; font-weight:600; }
  .sponsor-tagline{ display:block; font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.4; }

  /* Covers the screen the instant the tab/app backgrounds, so the OS's
     app-switcher preview shows this instead of whatever was on screen.
     This is the one real, honest thing a web page can do here — it is
     not screenshot or screen-recording prevention, which no browser API
     allows a page to detect or block at all. */
  .privacy-shield{ position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; }
  .privacy-shield .seal{ width:56px; height:56px; opacity:0.5; }
  .qr-box{ background:#fff; border-radius:10px; padding:12px; display:flex; align-items:center; justify-content:center; margin:10px 0; }
  .qr-box img, .qr-box canvas, .qr-box table{ display:block; }
  .ttl-row{ display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
  .ttl-opt{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 11px; font-size:12.5px; cursor:pointer; color:var(--text-muted); }
  .ttl-opt.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .flame-badge{ font-size:10.5px; opacity:.8; margin-right:4px; }
  .burn-armed{ background:var(--accent) !important; color:var(--accent-ink) !important; border-color:var(--accent) !important; }
  .scan-overlay{ position:fixed; inset:0; background:#000; z-index:40; display:flex; flex-direction:column; }
  .scan-overlay video{ flex:1; width:100%; object-fit:cover; }
  .scan-overlay .scan-bar{ padding:16px; background:var(--surface); display:flex; flex-direction:column; gap:10px; }
  .scan-result{ text-align:center; font-size:13.5px; }
  .expiry-note{ font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="privacy-shield" id="privacyShield"><svg class="seal" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="30" fill="var(--accent)"/><path d="M32 46 L24 30 H29 L32 37 L35 30 H40 L32 46 Z" fill="var(--accent-ink)"/></svg></div>
